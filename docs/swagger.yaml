definitions:
  constant.GatewayPaymentStatus:
    enum:
    - PENDING
    - SUCCESS
    - FAILED
    - CANCELLED
    type: string
    x-enum-varnames:
    - GatewayPaymentStatusPending
    - GatewayPaymentStatusSuccess
    - GatewayPaymentStatusFailed
    - GatewayPaymentStatusCancelled
  constant.PaymentStatus:
    enum:
    - initiated
    - pending
    - success
    - failed
    type: string
    x-enum-varnames:
    - PaymentStatusInitiated
    - PaymentStatusPending
    - PaymentStatusSuccess
    - PaymentStatusFailed
  constant.WithdrawalStatus:
    enum:
    - initiated
    - pending
    - success
    - failed
    - cancelled
    type: string
    x-enum-varnames:
    - WithdrawalStatusInitiated
    - WithdrawalStatusPending
    - WithdrawalStatusSuccess
    - WithdrawalStatusFailed
    - WithdrawalStatusCancelled
  dto.Address:
    properties:
      city:
        type: string
      country:
        type: string
      created_at:
        type: string
      id:
        type: integer
      is_default:
        type: boolean
      label:
        type: string
      phone:
        type: string
      recipient_name:
        type: string
      region:
        type: string
      street:
        type: string
      user_id:
        type: integer
    type: object
  dto.AdminLoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.AdminUpdateStoreStatusRequest:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  dto.AuthResponse:
    properties:
      deliveryAgentId:
        type: integer
      hasStore:
        type: boolean
      isDelivery:
        type: boolean
      role:
        type: string
      storeId:
        type: integer
      telegramUserId:
        type: integer
      token:
        type: string
      userId:
        type: integer
      username:
        type: string
    type: object
  dto.CartItem:
    properties:
      product:
        $ref: '#/definitions/dto.Product'
      quantity:
        type: integer
    type: object
  dto.CartResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.CartItem'
        type: array
      total_price:
        type: number
    type: object
  dto.Category:
    properties:
      id:
        type: integer
      name:
        type: string
      store_id:
        type: integer
    type: object
  dto.CheckoutRequest:
    properties:
      address_id:
        type: integer
      medium:
        enum:
        - MPESA
        - TELEBIRR
        - CBE
        - ETHSWITCH
        type: string
      phone_number:
        type: string
      store_id:
        type: integer
    required:
    - address_id
    - medium
    - store_id
    type: object
  dto.CheckoutResponse:
    properties:
      order:
        $ref: '#/definitions/dto.Order'
      payment:
        $ref: '#/definitions/dto.Payment'
    type: object
  dto.CreateAddressRequest:
    properties:
      city:
        type: string
      country:
        type: string
      is_default:
        type: boolean
      label:
        description: 'home, work, other (optional — default: home)'
        type: string
      phone:
        type: string
      recipient_name:
        type: string
      region:
        type: string
      street:
        type: string
    type: object
  dto.CreateCategoryRequest:
    properties:
      name:
        type: string
    type: object
  dto.CreateProductStoryRequest:
    properties:
      caption:
        type: string
      ends_at:
        description: RFC3339
        type: string
      media_type:
        description: '"image" | "video"'
        type: string
      media_urls:
        items:
          type: string
        type: array
      product_id:
        type: integer
      starts_at:
        description: RFC3339
        type: string
    type: object
  dto.CreateStoreRequest:
    properties:
      category:
        type: string
      cover_image:
        type: string
      description:
        type: string
      email:
        type: string
      location:
        type: string
      logo_image:
        type: string
      name:
        type: string
      phone:
        type: string
      telegram_chat_id:
        type: integer
    type: object
  dto.Order:
    properties:
      created_at:
        type: string
      customer:
        $ref: '#/definitions/dto.OrderCustomer'
      id:
        type: integer
      order_items:
        items:
          $ref: '#/definitions/dto.OrderItem'
        type: array
      shipping_address:
        $ref: '#/definitions/dto.Address'
      status:
        type: string
      store_id:
        type: integer
      total_price:
        type: number
      user_id:
        type: integer
    type: object
  dto.OrderAnalytics:
    properties:
      average_order_value:
        type: number
      cancellation_rate_pct:
        type: number
      orders_by_status:
        items:
          $ref: '#/definitions/dto.OrdersByStatus'
        type: array
      recent_orders:
        description: last 7 days
        type: integer
      total_orders:
        type: integer
    type: object
  dto.OrderCustomer:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  dto.OrderItem:
    properties:
      id:
        type: integer
      order_id:
        type: integer
      price:
        type: number
      product:
        $ref: '#/definitions/dto.OrderProductDetail'
      product_id:
        type: integer
      quantity:
        type: integer
    type: object
  dto.OrderProductDetail:
    properties:
      category:
        type: string
      id:
        type: integer
      images:
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  dto.OrdersByStatus:
    properties:
      count:
        type: integer
      percentage:
        type: number
      status:
        type: string
    type: object
  dto.PaginatedResponse:
    properties:
      data: {}
      has_next:
        type: boolean
      has_previous:
        type: boolean
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  dto.Payment:
    properties:
      amount:
        type: number
      created_at:
        type: string
      currency:
        type: string
      gateway_status:
        $ref: '#/definitions/constant.GatewayPaymentStatus'
      id:
        type: integer
      medium:
        type: string
      method:
        type: string
      order_id:
        type: integer
      phone_number:
        type: string
      reference:
        type: string
      status:
        $ref: '#/definitions/constant.PaymentStatus'
      transaction_id:
        type: string
    type: object
  dto.PeriodRevenue:
    properties:
      orders:
        type: integer
      period:
        description: e.g. "2026-07-08"
        type: string
      revenue:
        type: number
    type: object
  dto.Product:
    properties:
      category:
        type: string
      description:
        type: string
      id:
        type: integer
      images:
        items:
          type: string
        type: array
      is_boosted:
        type: boolean
      is_posted:
        type: boolean
      name:
        type: string
      price:
        type: number
      seller_id:
        type: integer
      status:
        type: string
      stock:
        type: integer
      store_id:
        type: integer
    type: object
  dto.ProductAnalytics:
    properties:
      low_stock_count:
        description: stock <= 5
        type: integer
      out_of_stock_count:
        description: stock == 0
        type: integer
      products_by_status:
        items:
          $ref: '#/definitions/dto.ProductByStatus'
        type: array
      top_viewed_products:
        items:
          $ref: '#/definitions/dto.TopViewedProduct'
        type: array
      total_products:
        type: integer
    type: object
  dto.ProductByStatus:
    properties:
      count:
        type: integer
      status:
        description: draft, published, archived
        type: string
    type: object
  dto.ProductStory:
    properties:
      caption:
        type: string
      created_at:
        type: string
      ends_at:
        description: RFC3339
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      media_type:
        type: string
      media_urls:
        items:
          type: string
        type: array
      product:
        allOf:
        - $ref: '#/definitions/dto.Product'
        description: Product detail is populated only on single-story fetch (GetStory)
      product_id:
        type: integer
      starts_at:
        description: RFC3339
        type: string
      store_id:
        type: integer
      views:
        type: integer
    type: object
  dto.RejectStoreKYCRequest:
    properties:
      reviewNote:
        type: string
    type: object
  dto.SalesAnalytics:
    properties:
      average_order_value:
        type: number
      revenue_by_period:
        items:
          $ref: '#/definitions/dto.PeriodRevenue'
        type: array
      revenue_change_pct:
        type: number
      top_selling_products:
        items:
          $ref: '#/definitions/dto.TopProduct'
        type: array
      total_orders:
        type: integer
      total_revenue:
        type: number
    type: object
  dto.Store:
    properties:
      category:
        type: string
      cover_image:
        type: string
      description:
        type: string
      email:
        type: string
      id:
        type: integer
      location:
        type: string
      logo_image:
        type: string
      name:
        type: string
      phone:
        type: string
      seller_id:
        type: integer
      status:
        type: string
      telegram_chat_id:
        type: integer
      telegram_chat_title:
        type: string
      verificationStatus:
        type: string
    type: object
  dto.StoreKYCResponse:
    properties:
      businessLicenseUrl:
        type: string
      businessRegistrationNumber:
        type: string
      reviewNote:
        type: string
      reviewedAt:
        type: string
      storeId:
        type: integer
      storeName:
        type: string
      submittedAt:
        type: string
      tinCertificateUrl:
        type: string
      tinNumber:
        type: string
      verificationStatus:
        type: string
    type: object
  dto.StoryAnalytics:
    properties:
      active_stories:
        type: integer
      expired_stories:
        type: integer
      top_stories:
        items:
          $ref: '#/definitions/dto.TopStory'
        type: array
      total_stories:
        type: integer
      total_views:
        type: integer
    type: object
  dto.SubmitStoreKYCRequest:
    properties:
      businessLicenseUrl:
        type: string
      businessRegistrationNumber:
        type: string
      tinCertificateUrl:
        type: string
      tinNumber:
        type: string
    type: object
  dto.TopProduct:
    properties:
      product_id:
        type: integer
      product_name:
        type: string
      revenue:
        type: number
      units_sold:
        type: integer
    type: object
  dto.TopStory:
    properties:
      caption:
        type: string
      ends_at:
        type: string
      product_id:
        type: integer
      starts_at:
        type: string
      story_id:
        type: integer
      views:
        type: integer
    type: object
  dto.TopViewedProduct:
    properties:
      category:
        type: string
      product_id:
        type: integer
      product_name:
        type: string
      views:
        type: integer
    type: object
  dto.UpdateAddressRequest:
    properties:
      city:
        type: string
      country:
        type: string
      is_default:
        type: boolean
      label:
        type: string
      phone:
        type: string
      recipient_name:
        type: string
      region:
        type: string
      street:
        type: string
    type: object
  dto.UpdateProductStoryRequest:
    properties:
      caption:
        type: string
      ends_at:
        type: string
      is_active:
        type: boolean
      media_type:
        type: string
      media_urls:
        items:
          type: string
        type: array
      starts_at:
        type: string
    type: object
  dto.UpdateStoreRequest:
    properties:
      category:
        type: string
      cover_image:
        type: string
      description:
        type: string
      email:
        type: string
      location:
        type: string
      logo_image:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  dto.UpdateUserPreferencesRequest:
    properties:
      categories:
        items:
          type: string
        type: array
      enabled:
        type: boolean
    type: object
  dto.UserPreferences:
    properties:
      categories:
        items:
          type: string
        type: array
      enabled:
        type: boolean
    type: object
  dto.Wallet:
    properties:
      available_balance:
        type: number
      currency:
        type: string
      id:
        type: integer
      locked_balance:
        type: number
      pending_balance:
        type: number
      store_id:
        type: integer
      total_earned:
        type: number
      total_withdrawn:
        type: number
    type: object
  dto.Withdrawal:
    properties:
      amount:
        type: number
      created_at:
        type: string
      currency:
        type: string
      gateway_status:
        $ref: '#/definitions/constant.GatewayPaymentStatus'
      id:
        type: integer
      medium:
        type: string
      phone_number:
        type: string
      reference:
        type: string
      status:
        $ref: '#/definitions/constant.WithdrawalStatus'
      store_id:
        type: integer
      transaction_id:
        type: string
    type: object
  dto.WithdrawalRequest:
    properties:
      amount:
        type: number
      currency:
        enum:
        - ETB
        - USD
        type: string
      medium:
        enum:
        - MPESA
        - TELEBIRR
        - CBE
        - ETHSWITCH
        type: string
      phone_number:
        type: string
    required:
    - amount
    - currency
    - medium
    - phone_number
    type: object
  errorx.AppError:
    properties:
      details:
        additionalProperties: true
        type: object
      error:
        $ref: '#/definitions/errorx.ErrorCode'
      message:
        type: string
    type: object
  errorx.ErrorCode:
    enum:
    - UNAUTHORIZED
    - FORBIDDEN
    - VALIDATION_ERROR
    - NOT_FOUND
    - INTERNAL_ERROR
    - BAD_REQUEST
    - CONFLICT
    type: string
    x-enum-varnames:
    - ErrUnauthorized
    - ErrForbidden
    - ErrValidation
    - ErrNotFound
    - ErrInternal
    - ErrBadRequest
    - ErrConflict
  response.BaseResponse:
    properties:
      data: {}
      error: {}
      success:
        type: boolean
    type: object
info:
  contact: {}
paths:
  /admin/orders:
    get:
      description: Cross-store order list with optional store_id, order_id, status,
        and customer search
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by store ID
        in: query
        name: store_id
        type: integer
      - description: Search by exact order ID
        in: query
        name: order_id
        type: integer
      - description: Filter by order status
        in: query
        name: status
        type: string
      - description: Search customer username
        in: query
        name: query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.PaginatedResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
      summary: List global orders (platform admin)
      tags:
      - Platform Admin
  /admin/store-verifications:
    get:
      description: Paginated KYC queue with optional status and search by store name
        or TIN
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by verification status (pending_review, verified, rejected)
        in: query
        name: status
        type: string
      - description: Search store name or TIN
        in: query
        name: query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.PaginatedResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
      summary: List store KYC verifications (platform admin)
      tags:
      - Platform Admin
  /admin/store-verifications/:store_id/approve:
    post:
      description: Marks store verification as verified after KYC review
      parameters:
      - description: Store ID
        in: path
        name: store_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.StoreKYCResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
      summary: Approve store KYC (platform admin)
      tags:
      - Platform Admin
  /admin/store-verifications/:store_id/reject:
    post:
      consumes:
      - application/json
      description: Rejects store KYC with an optional review note
      parameters:
      - description: Store ID
        in: path
        name: store_id
        required: true
        type: integer
      - description: Rejection reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/dto.RejectStoreKYCRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.StoreKYCResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
      summary: Reject store KYC (platform admin)
      tags:
      - Platform Admin
  /admin/stores:
    get:
      description: Paginated store list with optional status, verification_status,
        category, and text search
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: page_size
        type: integer
      - description: Filter by store status (pending, launched, banned)
        in: query
        name: status
        type: string
      - description: Filter by verification status
        in: query
        name: verification_status
        type: string
      - description: Filter by category
        in: query
        name: category
        type: string
      - description: Search name, description, location, or phone
        in: query
        name: query
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.PaginatedResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
      summary: List stores (platform admin)
      tags:
      - Platform Admin
  /admin/stores/:store_id:
    get:
      description: Returns full store profile by ID
      parameters:
      - description: Store ID
        in: path
        name: store_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.Store'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
            - properties:
                error:
                  $ref: '#/definitions/errorx.AppError'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.BaseResponse'
